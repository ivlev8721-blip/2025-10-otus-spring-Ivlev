apiVersion: apps/v1
kind: Deployment
metadata:
  name: vinyl-library
  namespace: default
  labels:
    app: vinyl-library
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vinyl-library
  template:
    metadata:
      labels:
        app: vinyl-library
    spec:
      containers:
      - name: vinyl-library
        image: vinyl-library:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "kubernetes"
        - name: DB_URL
          value: "jdbc:postgresql://postgres-service:5432/vinyldb"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "postgres"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: vinyl-library-secrets
              key: jwt-secret
        - name: SERVER_PORT
          value: "8080"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: vinyl-library-config
