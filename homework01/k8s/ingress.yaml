apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vinyl-library-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  rules:
  - host: vinyl-library.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: vinyl-library-service
            port:
              number: 80
  tls:
  - hosts:
    - vinyl-library.example.com
    secretName: vinyl-library-tls
