spring:
  datasource:
    driverClassName: org.h2.Driver
    url: jdbc:h2:mem:librarydb
    username: sa
    password: sa
    data: classpath*:data-test.sql

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    generate-ddl: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        connection:
          characterEncoding: UTF-8
          useUnicode: true
    show-sql: true

jwt:
  secret: mySecretKeyForJWTTokenGenerationThatIsLongEnoughForHS512AlgorithmAndSecureEnough1234567890
  sessionTime: 1200000000

logging:
  charset:
    console: UTF-8
  level:
    org.springframework.web: DEBUG