spring:
  datasource:
    driverClassName: org.h2.Driver
    url: jdbc:h2:mem:librarydb
    username: sa
    password: sa
    data: classpath*:data-test.sql
    sqlScriptEncoding: UTF-8

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    generate-ddl: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: true