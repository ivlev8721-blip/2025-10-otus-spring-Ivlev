databaseChangeLog:
  - changeSet:
      id: 004-add-description-column
      author: vivlev
      changes:
        - addColumn:
            tableName: album
            columns:
              - column:
                  name: description
                  type: text
                  
  - changeSet:
      id: 004-update-album-descriptions
      author: vivlev
      changes:
        - update:
            tableName: album
            where: title = 'Dark Side of the Moon'
            columns:
              - column:
                  name: description
                  value: |
                    Альбом The Dark Side of the Moon группы Pink Floyd, выпущенный в 1973 году, является одним из величайших и наиболее влиятельных альбомов в истории музыки. Он превратил музыкантов из любимцев арт-хаусной сцены в суперзвезд мирового масштаба.
                    
                    К началу 1970-х группа активно гастролировала, и стресс от постоянных переездов стал одной из главных тем для нового материала. Басист Роджер Уотерс предложил концепцию альбома о том, "что сводит людей с ума" — давлении современной жизни, времени, деньгах и смерти.
                    
                    Записывался альбом в знаменитой лондонской студии Abbey Road с июня 1972 по январь 1973 года. Инженером записи выступил Алан Парсонс. Группа использовала передовые для того времени 16-дорожечные магнитофоны, что позволило создать новаторское объемное звучание.
                    
                    Альбом продержался в Billboard Top 200 рекордные 741 неделю (более 14 лет подряд с 1973 по 1988 год). Общий тираж превышает 45 миллионов копий по всему миру. Знаменитая обложка с призмой была выбрана музыкантами всего за три минуты из семи предложенных вариантов.
                    
        - update:
            tableName: album
            where: title = 'Kind of Blue'
            columns:
              - column:
                  name: description
                  value: |
                    Kind of Blue — легендарный джазовый альбом Майлса Дэвиса, выпущенный в 1959 году, считается одним из величайших джазовых альбомов всех времен и самым продаваемым джазовым альбомом в истории.
                    
                    Альбом был записан всего за две сессии в студии Columbia Records в Нью-Йорке (2 марта и 22 апреля 1959 года). В записи участвовали легендарные музыканты: Джон Колтрейн, Кэннонболл Эддерли, Билл Эванс, Пол Чемберс и Джимми Кобб.
                    
                    Дэвис использовал революционный для того времени модальный подход к импровизации, отойдя от традиционной аккордовой структуры. Музыканты получили минимальные инструкции перед записью — Дэвис просто показывал им гаммы и настроение композиции.
                    
                    Альбом оказал огромное влияние на развитие джаза и продан тиражом более 5 миллионов копий. Композиция "So What" стала одной из самых узнаваемых джазовых мелодий в истории. В 2019 году альбом был включен в Национальный реестр звукозаписей США как культурно значимое произведение.
                    
        - update:
            tableName: album
            where: title = 'Abbey Road'
            columns:
              - column:
                  name: description
                  value: |
                    Abbey Road — одиннадцатый студийный альбом The Beatles, выпущенный 26 сентября 1969 года, стал последним альбомом группы, записанным совместно (хотя Let It Be был выпущен позже).
                    
                    Альбом был записан в легендарной студии Abbey Road Studios в Лондоне с февраля по август 1969 года. Продюсером выступил Джордж Мартин, а звукорежиссером — Джефф Эмерик. Несмотря на внутренние разногласия в группе, музыканты создали один из своих самых совершенных альбомов.
                    
                    Знаменитая обложка с участниками группы, переходящими пешеходный переход на Эбби-Роуд, стала одной из самых узнаваемых в истории музыки. Фотография была сделана 8 августа 1969 года фотографом Иэном Макмилланом всего за 10 минут.
                    
                    Альбом дебютировал на первом месте в чартах Великобритании и США. Медли на второй стороне пластинки, состоящее из восьми песен, плавно переходящих друг в друга, считается одним из величайших достижений группы. Композиции "Come Together", "Something" и "Here Comes the Sun" стали классикой рок-музыки.
