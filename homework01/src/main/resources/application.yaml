spring:
  datasource:
    driverClassName: org.h2.Driver
    url: jdbc:h2:mem:librarydb
    username: sa
    password: sa
    schema: classpath*:schema.sql
    data: classpath*:data.sql
    initialization-mode: always

  h2:
    console:
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    generate-ddl: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false

jwt:
  secret: alexander1984alexander1984alexander1984alexander1984alexander1984alexander1984alexander1984alexander1984
  sessionTime: 1200000000

management:
  endpoints:
    web:
      exposure:
        include: hystrix.stream, health, logfile, metrics, info
  endpoint:
    health:
      show-details: always
    logfile:
      enabled: true
    hystrix:
      enabled: true

logging:
  file:
    name: /logs/application-log.log

kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  consumer:
    group-id: library-group
    auto-offset-reset: earliest
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    properties:
      spring.json.trusted.packages: "*"
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  topics:
    book-events: book-events
    author-events: author-events
    genre-events: genre-events
    comment-events: comment-events

hystrix:
  command:
    default:
      execution:
        isolation:
          thread:
            timeoutInMilliseconds: 3000
      circuitBreaker:
        enabled: true
        requestVolumeThreshold: 5
        errorThresholdPercentage: 50
        sleepWindowInMilliseconds: 10000
  threadpool:
    default:
      coreSize: 10
      maxQueueSize: -1