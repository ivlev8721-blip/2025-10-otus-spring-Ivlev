<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя коллекция - VinylLib</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .album-card { transition: transform 0.2s; cursor: pointer; }
        .album-card:hover { transform: translateY(-5px); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .album-cover { width: 100%; height: 200px; object-fit: cover; }
        .navbar-brand { font-weight: bold; font-size: 1.5rem; }
        .nav-tabs { margin-bottom: 20px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-record-vinyl"></i> VinylLib</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="/catalog">Каталог</a></li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link active" href="/my-collection">Моя коллекция</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" href="/admin">Админ</a>
                    </li>
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" href="/login">Вход</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-link nav-link">Выход</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1><i class="fas fa-folder-open"></i> Моя коллекция</h1>

        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="collection-tab" data-bs-toggle="tab" data-bs-target="#collection" type="button">
                    <i class="fas fa-compact-disc"></i> Коллекция (<span th:text="${collection != null ? collection.size() : 0}">0</span>)
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="wishlist-tab" data-bs-toggle="tab" data-bs-target="#wishlist" type="button">
                    <i class="fas fa-heart"></i> Вишлист (<span th:text="${wishlist != null ? wishlist.size() : 0}">0</span>)
                </button>
            </li>
        </ul>

        <div class="tab-content" id="myTabContent">
            <div class="tab-pane fade show active" id="collection" role="tabpanel">
                <div class="row mt-3">
                    <div th:if="${collection == null || collection.isEmpty()}" class="col-12">
                        <div class="alert alert-info">
                            <i class="fas fa-info-circle"></i> Ваша коллекция пуста. Добавьте альбомы из каталога!
                        </div>
                    </div>
                    <div th:each="item : ${collection}" class="col-md-3 mb-4">
                        <div class="card album-card" th:onclick="'location.href=\'/album/' + ${item.album.id} + '\''">
                            <img th:src="${item.album.coverImageUrl}" class="card-img-top album-cover" 
                                 th:alt="${item.album.title}" onerror="this.src='/images/default-album.jpg'">
                            <div class="card-body">
                                <h6 class="card-title" th:text="${item.album.title}">Album Title</h6>
                                <p class="card-text text-muted small" th:text="${item.album.artist}">Artist</p>
                                <p class="card-text">
                                    <small class="text-muted">
                                        <span th:text="${item.album.genre?.name}">Genre</span> • 
                                        <span th:text="${item.album.releaseYear}">Year</span>
                                    </small>
                                </p>
                                <button class="btn btn-sm btn-danger" 
                                        th:onclick="'event.stopPropagation(); removeFromCollection(' + ${item.album.id} + ')'">
                                    <i class="fas fa-trash"></i> Удалить
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="wishlist" role="tabpanel">
                <div class="row mt-3">
                    <div th:if="${wishlist == null || wishlist.isEmpty()}" class="col-12">
                        <div class="alert alert-info">
                            <i class="fas fa-info-circle"></i> Ваш вишлист пуст. Добавьте альбомы, которые хотите приобрести!
                        </div>
                    </div>
                    <div th:each="item : ${wishlist}" class="col-md-3 mb-4">
                        <div class="card album-card" th:onclick="'location.href=\'/album/' + ${item.album.id} + '\''">
                            <img th:src="${item.album.coverImageUrl}" class="card-img-top album-cover" 
                                 th:alt="${item.album.title}" onerror="this.src='/images/default-album.jpg'">
                            <div class="card-body">
                                <h6 class="card-title" th:text="${item.album.title}">Album Title</h6>
                                <p class="card-text text-muted small" th:text="${item.album.artist}">Artist</p>
                                <p class="card-text">
                                    <small class="text-muted">
                                        <span th:text="${item.album.genre?.name}">Genre</span> • 
                                        <span th:text="${item.album.releaseYear}">Year</span>
                                    </small>
                                </p>
                                <button class="btn btn-sm btn-danger" 
                                        th:onclick="'event.stopPropagation(); removeFromWishlist(' + ${item.album.id} + ')'">
                                    <i class="fas fa-trash"></i> Удалить
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        const csrfToken = /*[[${_csrf.token}]]*/ '';
        const csrfHeader = /*[[${_csrf.headerName}]]*/ '';

        function getHeaders() {
            const headers = {};
            if (csrfToken && csrfHeader) {
                headers[csrfHeader] = csrfToken;
            }
            return headers;
        }

        function removeFromCollection(albumId) {
            if (confirm('Удалить альбом из коллекции?')) {
                fetch(`/api/collection/remove/${albumId}`, { 
                    method: 'DELETE',
                    headers: getHeaders()
                })
                .then(() => location.reload())
                .catch(err => alert('Ошибка при удалении'));
            }
        }

        function removeFromWishlist(albumId) {
            if (confirm('Удалить альбом из вишлиста?')) {
                fetch(`/api/collection/remove/${albumId}`, { 
                    method: 'DELETE',
                    headers: getHeaders()
                })
                .then(() => location.reload())
                .catch(err => alert('Ошибка при удалении'));
            }
        }
    </script>
</body>
</html>
