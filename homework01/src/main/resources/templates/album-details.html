<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${album.title} + ' - VinylLib'">Album - VinylLib</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .album-cover-large { width: 100%; max-width: 400px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .navbar-brand { font-weight: bold; font-size: 1.5rem; }
        .track-list { list-style: none; padding: 0; }
        .track-item { padding: 10px; border-bottom: 1px solid #eee; cursor: pointer; }
        .track-item:hover { background-color: #f8f9fa; }
        .review-card { margin-bottom: 15px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-record-vinyl"></i> VinylLib</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="/catalog">Каталог</a></li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link" href="/my-collection">Моя коллекция</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" href="/admin">Админ</a>
                    </li>
                    <li class="nav-item" sec:authorize="!isAuthenticated()">
                        <a class="nav-link" href="/login">Вход</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-link nav-link">Выход</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-4">
                <img th:src="${album.coverImageUrl}" class="album-cover-large" 
                     th:alt="${album.title}" onerror="this.src='/images/default-album.jpg'">
                <div class="mt-3" sec:authorize="isAuthenticated()">
                    <button class="btn btn-primary w-100 mb-2" onclick="addToCollection()">
                        <i class="fas fa-plus"></i> Добавить в коллекцию
                    </button>
                    <button class="btn btn-outline-danger w-100" onclick="addToWishlist()">
                        <i class="fas fa-heart"></i> Добавить в вишлист
                    </button>
                </div>
            </div>
            
            <div class="col-md-8">
                <h1 th:text="${album.title}">Album Title</h1>
                <h3 class="text-muted" th:text="${album.artist}">Artist</h3>
                <p>
                    <span class="badge bg-secondary" th:text="${album.genre?.name}">Genre</span>
                    <span class="badge bg-info" th:text="${album.releaseYear}">Year</span>
                </p>

                <div th:if="${album.description}" class="mt-4 mb-4">
                    <h4>Об альбоме</h4>
                    <div class="card">
                        <div class="card-body">
                            <p th:text="${album.description}" style="white-space: pre-line;">Album description</p>
                        </div>
                    </div>
                </div>

                <h4 class="mt-4">Треки</h4>
                <ul class="track-list">
                    <li th:each="track, iterStat : ${album.tracks}" class="track-item" 
                        th:onclick="'playTrack(' + ${track.id} + ')'">
                        <i class="fas fa-play-circle"></i>
                        <span th:text="${iterStat.count} + '. ' + ${track.title}">1. Track Title</span>
                        <span class="float-end text-muted" th:text="${track.duration}">3:45</span>
                    </li>
                </ul>

                <h4 class="mt-4">Отзывы</h4>
                <div sec:authorize="isAuthenticated()" class="mb-3">
                    <form id="reviewForm">
                        <div class="mb-2">
                            <label>Рейтинг:</label>
                            <select class="form-select" id="rating">
                                <option value="5">5 - Отлично</option>
                                <option value="4">4 - Хорошо</option>
                                <option value="3">3 - Нормально</option>
                                <option value="2">2 - Плохо</option>
                                <option value="1">1 - Ужасно</option>
                            </select>
                        </div>
                        <textarea class="form-control mb-2" id="reviewText" rows="3" placeholder="Ваш отзыв..."></textarea>
                        <button type="button" class="btn btn-primary" onclick="submitReview()">Отправить отзыв</button>
                    </form>
                </div>

                <div id="reviewsContainer">
                    <div th:each="review : ${reviews}" class="card review-card">
                        <div class="card-body">
                            <h6 class="card-subtitle mb-2 text-muted" th:text="${review.user.login}">User</h6>
                            <div class="mb-2">
                                <span th:each="i : ${#numbers.sequence(1, review.rating)}">⭐</span>
                            </div>
                            <p class="card-text" th:text="${review.comment}">Review text</p>
                            <small class="text-muted" th:text="${#temporals.format(review.createdAt, 'dd.MM.yyyy HH:mm')}">Date</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        const albumId = /*[[${album.id}]]*/ 0;
        const csrfToken = /*[[${_csrf.token}]]*/ '';
        const csrfHeader = /*[[${_csrf.headerName}]]*/ '';

        function getHeaders() {
            const headers = { 'Content-Type': 'application/json' };
            if (csrfToken && csrfHeader) {
                headers[csrfHeader] = csrfToken;
            }
            return headers;
        }

        function addToCollection() {
            fetch(`/api/collection/add/${albumId}?wishlist=false`, {
                method: 'POST',
                headers: getHeaders()
            })
            .then(response => response.ok ? alert('Добавлено в коллекцию!') : alert('Ошибка'))
            .catch(() => alert('Ошибка при добавлении'));
        }

        function addToWishlist() {
            fetch(`/api/collection/add/${albumId}?wishlist=true`, {
                method: 'POST',
                headers: getHeaders()
            })
            .then(response => response.ok ? alert('Добавлено в вишлист!') : alert('Ошибка'))
            .catch(() => alert('Ошибка при добавлении'));
        }

        function playTrack(trackId) {
            fetch('/api/stream/listen', {
                method: 'POST',
                headers: getHeaders(),
                body: JSON.stringify({ trackId: trackId })
            })
            .then(() => console.log('Playing track:', trackId))
            .catch(err => console.error('Error:', err));
        }

        function submitReview() {
            const rating = document.getElementById('rating').value;
            const comment = document.getElementById('reviewText').value;
            
            fetch('/api/reviews', {
                method: 'POST',
                headers: getHeaders(),
                body: JSON.stringify({ albumId: albumId, rating: rating, comment: comment })
            })
            .then(response => response.ok ? location.reload() : alert('Ошибка'))
            .catch(() => alert('Ошибка при отправке отзыва'));
        }
    </script>
</body>
</html>
