version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    container_name: vinyl-postgres
    environment:
      POSTGRES_DB: vinyldb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - vinyl-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vinyl-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vinyl.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - vinyl-network

  vinyl-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vinyl-spring-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
      - JAVA_OPTS=-Xmx512m -Xms256m
      - DB_URL=jdbc:postgresql://postgres:5432/vinyldb
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - JWT_SECRET=alexander1984alexander1984alexander1984alexander1984alexander1984alexander1984alexander1984alexander1984
      - SERVER_PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - vinyl-network

volumes:
  postgres-data:

networks:
  vinyl-network:
    driver: bridge
